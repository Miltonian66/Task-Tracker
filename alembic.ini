[alembic]
# Каталог со скриптами миграций (внутри пакета app, чтобы попадал в Docker-образ).
script_location = app/migrations

# Шаблон имени файла ревизии: дата + slug.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Путь поиска модулей: корень проекта, чтобы импортировался пакет app.
prepend_sys_path = .

# sqlalchemy.url НЕ задаём здесь намеренно: URL берётся из app.config.get_settings()
# внутри env.py (единый источник правды, поддержка переменных окружения / .env).

[post_write_hooks]
# Прогоняем сгенерированные миграции через ruff, чтобы CI (ruff format --check) не падал.
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
